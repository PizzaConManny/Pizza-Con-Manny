<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza con Manny 🍕 | Calcolatore Impasto Pro</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js per i calcoli in tempo reale -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Container Principale -->
    <div class="max-w-md mx-auto px-4 pt-6" x-data="{
        tipoProdotto: 'pizza', // 'pizza' o 'pane'
        numeroPizze: 4,
        pesoPanetto: 270,
        pesoPaneTotale: 1000, // Peso in grammi del pane finale (da 100g a 2500g)
        idratazione: 65,
        salePerKg: 25, // Grammi di sale per kg di farina
        tipoFarina: '00', // Opzioni: '00', '0', '1', 'integrale'
        usaLievitoSecco: false,
        usaFrigo: true,
        oreFrigo: 12,
        tempFrigo: 4,
        oreAmbiente: 6,
        tempAmbiente: 22, // Temperatura stanza in °C

        // Fattore di fermentazione in base alla farina
        get fattoreFarina() {
            switch(this.tipoFarina) {
                case '1': return 0.92;
                case 'integrale': return 0.82;
                case '0': return 0.98;
                case '00':
                default: return 1.0;
            }
        },

        // Peso complessivo dell'impasto in base alla scelta
        get pesoTotale() {
            if (this.tipoProdotto === 'pizza') {
                return this.numeroPizze * this.pesoPanetto;
            } else {
                return parseInt(this.pesoPaneTotale);
            }
        },

        get farina() {
            let idr = this.idratazione / 100;
            let saleRapporto = this.salePerKg / 1000;
            return Math.round(this.pesoTotale / (1 + idr + saleRapporto));
        },

        get acqua() {
            return Math.round(this.farina * (this.idratazione / 100));
        },

        get sale() {
            return Math.round((this.farina * (this.salePerKg / 1000)) * 10) / 10;
        },

        // Calcolo cinetico della fermentazione basato sulla temperatura ambiente reale
        get tempoTotaleEquivalente() {
            let frigoEq = this.usaFrigo ? (this.oreFrigo * 0.1) : 0;
            let fattoreTempAmb = Math.pow(2, (this.tempAmbiente - 22) / 10);
            let ambEq = this.oreAmbiente * fattoreTempAmb;
            return Math.max(0.5, frigoEq + ambEq);
        },

        get lievito() {
            let lievitoFresco = (this.farina * (2 / this.tempoTotaleEquivalente)) / 100;
            lievitoFresco = lievitoFresco * this.fattoreFarina;
            let val = this.usaLievitoSecco ? (lievitoFresco * 0.33) : lievitoFresco;
            return val < 0.1 ? val.toFixed(2) : val.toFixed(1);
        }
    }">

        <!-- Header Brand -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-amber-500/10 rounded-full mb-2 border border-amber-500/30">
                <span class="text-3xl" x-text="tipoProdotto === 'pizza' ? '🍕' : '🍞'"></span>
            </div>
            <h1 class="text-2xl font-extrabold text-amber-400 tracking-tight">Pizza con Manny</h1>
            <p class="text-xs text-slate-400 font-medium">Calcolatore di Precisione per Impasti</p>
        </div>

        <!-- BOX RISULTATI (Evidenziato) -->
        <div class="bg-gradient-to-br from-amber-500 to-amber-600 rounded-2xl p-5 shadow-xl text-slate-950 mb-6 border border-amber-300/40">
            <div class="flex justify-between items-center mb-3 border-b border-amber-700/20 pb-2">
                <h2 class="font-extrabold text-lg uppercase tracking-wider">Formula Calcolata</h2>
                <span class="text-xs font-bold bg-slate-950 text-amber-400 px-2.5 py-1 rounded-full" x-text="pesoTotale + 'g Totali'"></span>
            </div>
            
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-slate-950/10 backdrop-blur-sm p-3 rounded-xl border border-slate-950/10">
                    <span class="block text-xs uppercase font-bold text-slate-900/80">Farina (<span x-text="tipoFarina.toUpperCase()"></span>)</span>
                    <span class="text-2xl font-black" x-text="farina + ' g'"></span>
                </div>
                <div class="bg-slate-950/10 backdrop-blur-sm p-3 rounded-xl border border-slate-950/10">
                    <span class="block text-xs uppercase font-bold text-slate-900/80">Acqua</span>
                    <span class="text-2xl font-black" x-text="acqua + ' g'"></span>
                </div>
                <div class="bg-slate-950/10 backdrop-blur-sm p-3 rounded-xl border border-slate-950/10">
                    <span class="block text-xs uppercase font-bold text-slate-900/80">Sale</span>
                    <span class="text-2xl font-black" x-text="sale + ' g'"></span>
                </div>
                <div class="bg-slate-950/10 backdrop-blur-sm p-3 rounded-xl border border-slate-950/10">
                    <span class="block text-xs uppercase font-bold text-slate-900/80" x-text="usaLievitoSecco ? 'Lievito Secco' : 'Lievito Fresco'"></span>
                    <span class="text-2xl font-black" x-text="lievito + ' g'"></span>
                </div>
            </div>
        </div>

        <!-- CONTROLLI DI INPUT -->
        <div class="bg-slate-800/80 rounded-2xl p-5 shadow-lg border border-slate-700/50 space-y-5">
            
            <!-- SELETTORE PRODOTTO: PANE O PIZZA -->
            <div>
                <label class="block text-sm font-semibold mb-2">Cosa vuoi preparare?</label>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="tipoProdotto = 'pizza'" 
                            :class="tipoProdotto == 'pizza' ? 'bg-amber-500 text-slate-950 font-bold shadow-lg' : 'bg-slate-700 text-slate-300'" 
                            class="py-2.5 rounded-xl text-sm transition-all flex items-center justify-center space-x-2">
                        <span>🍕 Pizza</span>
                    </button>
                    <button @click="tipoProdotto = 'pane'" 
                            :class="tipoProdotto == 'pane' ? 'bg-amber-500 text-slate-950 font-bold shadow-lg' : 'bg-slate-700 text-slate-300'" 
                            class="py-2.5 rounded-xl text-sm transition-all flex items-center justify-center space-x-2">
                        <span>🍞 Pane</span>
                    </button>
                </div>
            </div>

            <!-- 1A. CONTROLLI SPECIFICI PER PIZZA (Mostrati se tipoProdotto == 'pizza') -->
            <template x-if="tipoProdotto === 'pizza'">
                <div class="space-y-4 pt-2 border-t border-slate-700/50">
                    <div>
                        <label class="flex justify-between text-sm font-semibold mb-2">
                            <span>Numero Panetti:</span>
                            <span class="text-amber-400 font-bold text-base" x-text="numeroPizze"></span>
                        </label>
                        <input type="range" min="1" max="20" x-model="numeroPizze" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="flex justify-between text-sm font-semibold mb-2">
                            <span>Peso Singolo Panetto:</span>
                            <span class="text-amber-400 font-bold text-base" x-text="pesoPanetto + ' g'"></span>
                        </label>
                        <input type="range" min="180" max="380" step="5" x-model="pesoPanetto" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </template>

            <!-- 1B. CONTROLLI SPECIFICI PER PANE (Mostrati se tipoProdotto == 'pane') -->
            <template x-if="tipoProdotto === 'pane'">
                <div class="space-y-4 pt-2 border-t border-slate-700/50">
                    <div>
                        <label class="flex justify-between text-sm font-semibold mb-2">
                            <span>Peso Totale Pane Finale:</span>
                            <span class="text-amber-400 font-bold text-base" x-text="pesoPaneTotale + ' g'"></span>
                        </label>
                        <input type="range" min="100" max="2500" step="50" x-model="pesoPaneTotale" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                            <span>100g (Rosetta/Panino)</span>
                            <span>1kg (Pagnotta standard)</span>
                            <span>2.5kg (Grande forma)</span>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 2. Idratazione -->
            <div class="pt-2 border-t border-slate-700/50">
                <label class="flex justify-between text-sm font-semibold mb-2">
                    <span>Idratazione Desiderata:</span>
                    <span class="text-amber-400 font-bold text-base" x-text="idratazione + '%'"></span>
                </label>
                <input type="range" min="55" max="85" x-model="idratazione" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-[10px] text-slate-400 mt-1" x-text="tipoProdotto === 'pizza' ? '55% Napoletana • 85% Teglia' : '60% Pane Classico • 80%+ Alta Idratazione'"></div>
            </div>

            <!-- 3. Tipo di Farina -->
            <div class="pt-2 border-t border-slate-700/50">
                <label class="block text-sm font-semibold mb-2">Tipo di Farina:</label>
                <div class="grid grid-cols-4 gap-1.5">
                    <button @click="tipoFarina = '00'" :class="tipoFarina == '00' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-2 rounded-lg text-xs transition-all">Tipo 00</button>
                    <button @click="tipoFarina = '0'" :class="tipoFarina == '0' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-2 rounded-lg text-xs transition-all">Tipo 0</button>
                    <button @click="tipoFarina = '1'" :class="tipoFarina == '1' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-2 rounded-lg text-xs transition-all">Tipo 1</button>
                    <button @click="tipoFarina = 'integrale'" :class="tipoFarina == 'integrale' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-2 rounded-lg text-xs transition-all">Integrale</button>
                </div>
            </div>

            <!-- 4. Quantità Sale (g per kg di farina) -->
            <div class="pt-2 border-t border-slate-700/50">
                <label class="flex justify-between text-sm font-semibold mb-1">
                    <span>Sale (g per kg di farina):</span>
                    <span class="text-amber-400 font-bold text-base" x-text="salePerKg + ' g/kg'"></span>
                </label>
                <input type="range" min="15" max="35" x-model="salePerKg" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <p class="text-[11px] text-slate-400 mt-1">Intervallo suggerito: <strong class="text-slate-200">20g - 25g</strong> per chilo di farina.</p>
            </div>

            <!-- 5. Tipo di Lievito -->
            <div class="pt-2 border-t border-slate-700/50">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-semibold">Tipo di Lievito di Birra:</span>
                    <button @click="usaLievitoSecco = !usaLievitoSecco" 
                            class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200"
                            :class="usaLievitoSecco ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'">
                        <span x-text="usaLievitoSecco ? 'Secco / Disidratato' : 'Fresco in Panetto'"></span>
                    </button>
                </div>
            </div>

            <!-- 6. Lievitazione in Frigorifero -->
            <div class="pt-2 border-t border-slate-700/50">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-semibold">Maturazione in Frigo:</span>
                    <input type="checkbox" x-model="usaFrigo" class="w-5 h-5 accent-amber-500 rounded cursor-pointer">
                </div>

                <template x-if="usaFrigo">
                    <div class="space-y-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/30">
                        <div>
                            <label class="flex justify-between text-xs font-semibold mb-1">
                                <span>Ore di Frigorifero:</span>
                                <span class="text-amber-400 font-bold" x-text="oreFrigo + ' h'"></span>
                            </label>
                            <input type="range" min="1" max="72" x-model="oreFrigo" class="w-full accent-amber-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </template>
            </div>

            <!-- 7. SETTAGGIO TEMPERATURA AMBIENTE E ORE -->
            <div class="pt-2 border-t border-slate-700/50 space-y-4">
                
                <!-- Ore Temperatura Ambiente -->
                <div>
                    <label class="flex justify-between text-sm font-semibold mb-1">
                        <span>Ore a Temperatura Ambiente:</span>
                        <span class="text-amber-400 font-bold text-base" x-text="oreAmbiente + ' h'"></span>
                    </label>
                    <input type="range" min="1" max="24" x-model="oreAmbiente" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Temperatura Stanza (Slider + Scelte Rapide) -->
                <div class="bg-amber-500/5 p-3 rounded-xl border border-amber-500/20">
                    <label class="flex justify-between text-sm font-semibold mb-2">
                        <span>🌡️ Temperatura Ambiente Stanza:</span>
                        <span class="text-amber-400 font-bold text-base" x-text="tempAmbiente + ' °C'"></span>
                    </label>
                    
                    <!-- Slider Temperatura -->
                    <input type="range" min="12" max="35" x-model="tempAmbiente" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer mb-3">
                    
                    <!-- Pre-set rapidi di temperatura -->
                    <div class="grid grid-cols-4 gap-1.5 text-center">
                        <button @click="tempAmbiente = 18" :class="tempAmbiente == 18 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-1 rounded text-[11px] transition-all">18°C Inverno</button>
                        <button @click="tempAmbiente = 22" :class="tempAmbiente == 22 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-1 rounded text-[11px] transition-all">22°C Mite</button>
                        <button @click="tempAmbiente = 26" :class="tempAmbiente == 26 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-1 rounded text-[11px] transition-all">26°C Caldo</button>
                        <button @click="tempAmbiente = 28" :class="tempAmbiente == 28 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'" class="py-1 rounded text-[11px] transition-all">28°C Estate</button>
                    </div>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-xs text-slate-500">
            <p><strong>Pizza con Manny</strong> • Calcolatore dell'Impasto</p>
        </div>

    </div>

</body>
</html>
